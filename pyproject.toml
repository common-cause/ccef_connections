[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccef-connections"
version = "0.3.0"
description = "Reusable connection library for CCEF data integrations"
authors = [{name = "Common Cause Education Fund"}]
license = {text = "MIT"}
requires-python = ">=3.9"
readme = "README.md"
# Base install covers core (credentials, retry, exceptions) and all REST
# connectors: Action Builder, Action Network, Asana, Email (Resend), Geocodio,
# GitHub, HelpScout, PTV, ROI CRM, Zoom. Heavier connectors live behind extras below.
dependencies = [
    "requests>=2.31.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
airtable = [
    "pyairtable>=2.0.0",
]
sheets = [
    # Also required by ConfigManager (reads config from Google Sheets)
    "gspread>=5.12.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.25.0",
]
bigquery = [
    "google-cloud-bigquery>=3.13.0",
    "google-auth>=2.25.0",
    "db-dtypes>=1.1.0",
]
openai = [
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "pydantic>=2.0.0",
]
pandas = [
    "pandas>=2.0.0",
]
all = [
    "ccef-connections[airtable,sheets,bigquery,openai,pandas]",
]
dev = [
    "ccef-connections[all]",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
